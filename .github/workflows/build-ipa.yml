name: Build IPA

# Compile Roamcast sur un Mac GitHub (gratuit et illimité pour un dépôt public),
# publie une IPA NON signée en Release, puis met à jour la source AltStore.
# La signature se fait ensuite sur l'iPhone via AltStore (identifiant Apple gratuit).
#
# En cas d'échec, les erreurs sont publiées dans le RÉSUMÉ du build (page publique,
# lisible sans connexion) : il suffit de donner le lien du build à Claude.

on:
  push:
    branches: [main]
    paths:
      - "Roamcast/**"
      - "RoamcastTests/**"
      - "project.yml"
      - "Podfile"
      - ".github/workflows/build-ipa.yml"
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write   # créer la Release + committer la source AltStore

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MARKETING_VERSION: "0.1.${{ github.run_number }}"
      BUILD_NUMBER: "${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v5

      - name: Outils (XcodeGen, CocoaPods)
        run: |
          brew install xcodegen
          gem list cocoapods -i || sudo gem install cocoapods
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Génération du projet
        run: |
          xcodegen generate
          xcodebuild -list -project Roamcast.xcodeproj

      - name: Dépendances (SDK DJI via CocoaPods)
        run: pod install --repo-update

      - name: Compilation (sans signature)
        id: compile
        run: |
          set +e
          xcodebuild \
            -workspace Roamcast.xcworkspace \
            -scheme Roamcast \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DJI_APP_KEY="${{ secrets.DJI_APP_KEY }}" \
            TWITCH_CLIENT_ID="${{ secrets.TWITCH_CLIENT_ID }}" \
            build > build.log 2>&1
          status=$?
          set -e
          tail -5 build.log
          APP=build/Build/Products/Release-iphoneos/Roamcast.app
          if [ $status -ne 0 ] || [ ! -f "$APP/Info.plist" ] || [ ! -f "$APP/Roamcast" ]; then
            echo "xcodebuild a échoué (code $status)"
            exit 1
          fi

      - name: Publication des erreurs (résumé public du build)
        if: failure()
        run: |
          [ -f build.log ] || { echo "Échec avant la compilation : voir l'étape en rouge." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          # Annotations (affichées en haut de la page du build, max ~10)
          # (le shell GitHub tourne en pipefail : « || true » évite qu'un grep vide fasse échouer l'étape)
          { grep -E "error:|fatal error" build.log || true; } | sort -u | head -10 | while IFS= read -r l; do
            echo "::error::$l"
          done
          {
            echo "## ❌ Erreurs de compilation"
            echo '```'
            { grep -E "error:|fatal error" build.log || true; } | sort -u | head -80
            echo '```'
            echo "## Fin du log"
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Création de l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Roamcast.app Payload/
          zip -qry Roamcast.ipa Payload
          SIZE=$(stat -f%z Roamcast.ipa)
          echo "IPA : $SIZE octets"
          # Garde-fou : une vraie IPA avec le SDK DJI pèse des dizaines de Mo.
          [ "$SIZE" -gt 1000000 ] || { echo "::error::IPA suspecte ($SIZE octets)"; exit 1; }
          echo "✅ IPA : $(( SIZE / 1048576 )) Mo" >> "$GITHUB_STEP_SUMMARY"

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$MARKETING_VERSION" Roamcast.ipa \
            --title "Roamcast $MARKETING_VERSION" \
            --notes "Build automatique depuis ${GITHUB_SHA::7}. Installer via AltStore."

      - name: Mise à jour de la source AltStore
        run: |
          python3 scripts/update_altstore_source.py \
            --ipa Roamcast.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --version "$MARKETING_VERSION" \
            --build "$BUILD_NUMBER" \
            --notes "$(git log -1 --pretty=%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          git commit -m "AltStore : Roamcast $MARKETING_VERSION [skip ci]"
          git pull --rebase origin main
          git push
