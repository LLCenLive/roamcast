name: Roamcast
options:
  bundleIdPrefix: com.llcenlive
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    # Version épinglée : HaishinKitPublisher.swift est écrit pour l'API exacte de la 2.2.5
    # (qui exige Xcode 26).
    exactVersion: 2.2.5

settings:
  base:
    SWIFT_VERSION: "5.0"         # mode Swift 5 (concurrence stricte non imposée)
    # Pas de compte Apple payant : on compile SANS signature (CI),
    # la signature est faite ensuite par AltStore avec l'identifiant Apple gratuit.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    TARGETED_DEVICE_FAMILY: "1"   # iPhone uniquement
    ENABLE_BITCODE: NO
    # Xcode 15+ : sinon le script « [CP] Embed Pods Frameworks » de CocoaPods échoue.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Roamcast:
    type: application
    platform: iOS
    sources: [Roamcast]
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      # DJI SDK V4 + DJIWidget : via CocoaPods (voir Podfile), pas SPM.
    info:
      path: Roamcast/Info.plist
      properties:
        CFBundleDisplayName: Roamcast
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationLandscapeLeft]
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: "La caméra filme la balade diffusée en direct sur Twitch."
        NSMicrophoneUsageDescription: "Le micro (DJI Mic Mini ou iPhone) capte ton commentaire pour le live."
        NSLocationWhenInUseUsageDescription: "Le GPS calcule la distance parcourue. La position exacte n'est jamais diffusée."
        NSBluetoothAlwaysUsageDescription: "Connexion au micro DJI Mic Mini."
        NSLocalNetworkUsageDescription: "Communication avec la radiocommande DJI."
        # Protocoles MFi utilisés par la radiocommande DJI (External Accessory).
        UISupportedExternalAccessoryProtocols: [com.dji.video, com.dji.protocol, com.dji.common]
        # Clé d'app DJI (developer.dji.com), liée au bundle ID.
        DJISDKAppKey: "$(DJI_APP_KEY)"
        # Client ID de l'app Twitch (dev.twitch.tv/console) – type « Public ».
        TwitchClientID: "$(TWITCH_CLIENT_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llcenlive.roamcast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DJI_APP_KEY: ""
        TWITCH_CLIENT_ID: ""
    scheme:
      testTargets: [RoamcastTests]

  RoamcastTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RoamcastTests]
    dependencies:
      - target: Roamcast
